<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SparkTank – Idea Submission v2</title>
<style>
:root{
 --body-bg:#f3f2f1;--card-bg:#fff;--primary:#0078d4;--primary-dark:#005a9e;
 --text-main:#201f1e;--text-subtle:#605e5c;--border-subtle:#edebe9;
 --shadow-card:0 1.6px 3.6px rgba(0,0,0,.132),0 0.3px 0.9px rgba(0,0,0,.108);
 --radius:8px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
background:var(--body-bg);color:var(--text-main);}
.command-bar{display:flex;justify-content:space-between;align-items:center;
padding:8px 24px;background:linear-gradient(90deg,#0078d4,#005a9e);
color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.app-logo{width:28px;height:28px;border-radius:6px;background:#fff;color:#0078d4;
display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-right:8px;}
.persona{display:flex;align-items:center;gap:8px;}
.persona-avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);
display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;}
.content{padding:16px 24px;max-width:1200px;margin:0 auto;}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.page-title{font-size:24px;font-weight:600;}
.page-subtitle{font-size:13px;color:var(--text-subtle);}
.role-toggle{display:inline-flex;border-radius:999px;background:#fff;border:1px solid #c8c6c4;padding:2px;box-shadow:var(--shadow-card);}
.toggle-btn{border:none;background:transparent;padding:4px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--text-subtle);}
.toggle-btn.active{background:var(--primary);color:#fff;}
.timer-banner{background:#faf9f8;border:1px solid #e1dfdd;border-radius:var(--radius);
padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-weight:600;}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:4px;
border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;background:#f3f2f1;color:#323130;}
.btn:hover{background:#e1dfdd;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.team-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-card);
border:1px solid var(--border-subtle);padding:10px;}
.team-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.team-avatar{width:26px;height:26px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;}
.team-name{font-size:13px;font-weight:600;}
.team-status{font-size:11px;padding:2px 6px;border-radius:999px;background:#f3f2f1;color:var(--text-subtle);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:10;}
.modal{background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);
width:900px;max-width:95vw;height:80vh;display:flex;overflow:hidden;}
.modal-left{width:35%;border-right:1px solid #edebe9;overflow-y:auto;}
.modal-right{flex:1;overflow-y:auto;padding:16px 20px;}
.idea-item{padding:10px;border-bottom:1px solid #edebe9;cursor:pointer;}
.idea-item:hover{background:#f3f2f1;}
.idea-item.active{background:#e8f3fc;}
.idea-meta{font-size:12px;color:var(--text-subtle);}
.idea-title{font-weight:600;font-size:13px;}
.status-badge{font-size:11px;padding:2px 6px;border-radius:999px;background:#f3f2f1;margin-left:4px;}
.form-field{display:flex;flex-direction:column;margin-bottom:10px;}
textarea,input,select{font-family:inherit;font-size:13px;padding:6px 10px;border-radius:4px;border:1px solid #c8c6c4;background:#fff;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.choice-card{background:#faf9f8;border:1px solid #e1dfdd;border-radius:8px;padding:10px;cursor:pointer;}
.choice-card.selected{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
.notice{background:#e8f3fc;border:1px solid #b3d6f5;color:#004578;padding:8px;border-radius:6px;font-size:12px;margin-bottom:10px;}
#facilitatorView,#participantView{display:none;}
#facilitatorView.active,#participantView.active{display:block;}
</style>
</head>

<body>
<div class="command-bar">
 <div style="display:flex;align-items:center;">
   <div class="app-logo">ST</div>
   <div><div style="font-size:20px;font-weight:600;">SparkTank Workshop</div>
     <div style="font-size:12px;opacity:.9;">Idea Submission v2</div></div>
 </div>
 <div class="persona">
   <div class="persona-avatar">SJ</div>
   <div id="roleLabel" style="font-size:13px;">Facilitator</div>
 </div>
</div>

<main class="content">
 <div class="page-header">
   <div>
     <div class="page-title">Idea Submission</div>
     <div class="page-subtitle">Multi-idea submission & unlock workflow</div>
   </div>
   <div class="role-toggle">
     <button class="toggle-btn active" data-role="facilitator">Facilitator view</button>
     <button class="toggle-btn" data-role="participant">Participant view</button>
   </div>
 </div>

 <!-- FACILITATOR -->
 <div id="facilitatorView" class="active">
   <div class="timer-banner">
     <div>⏱ <span id="timerDisplay">20:00</span> remaining</div>
     <div>
       <button class="btn" id="pauseBtn">Pause</button>
       <button class="btn" id="resetBtn">Reset</button>
     </div>
   </div>
   <div class="teams-grid" id="facTeams"></div>
 </div>

 <!-- PARTICIPANT -->
 <div id="participantView">
   <div class="timer-banner">⏱ <span id="timerDisplayP">20:00</span> remaining</div>
   <div class="participant-form">
     <div id="noticeArea"></div>
     <div class="form-field"><label>Your name</label>
       <input id="submitterName" type="text" placeholder="Enter your name" /></div>
     <div class="form-field"><label>Team</label><select id="teamSelect"></select></div>
     <div class="form-field"><label>Type of use case</label>
       <div class="choice-grid">
         <div class="choice-card" data-type="better">🧩 Build Something Better<br><span style="font-size:11px;color:#605e5c;">Augment or automate a process</span></div>
         <div class="choice-card" data-type="new">🌍 Build Better Things<br><span style="font-size:11px;color:#605e5c;">Create a new capability or product</span></div>
       </div>
     </div>
     <div id="questionsArea"></div>
     <button class="btn btn-primary" id="submitIdeaBtn" disabled>Submit Idea</button>
   </div>
 </div>
</main>

<!-- MODAL -->
<div class="modal-backdrop" id="ideaModal">
 <div class="modal">
   <div class="modal-left" id="ideaList"></div>
   <div class="modal-right">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
       <div style="font-weight:600;font-size:16px;" id="modalTitle"></div>
       <button class="btn" id="closeModal">✕</button>
     </div>
     <div id="ideaDetail"></div>
   </div>
 </div>
</div>

 <script>
/* ---------- INITIAL STATE ---------- */
const state = {
  timer: 20 * 60,
  running: true,
  teams: [
    { id: "t1", name: "Table 1 – Finance", color: "#0078d4", ideas: [] },
    { id: "t2", name: "Table 2 – Support", color: "#107c10", ideas: [] },
    { id: "t3", name: "Table 3 – Sales", color: "#ca5010", ideas: [] }
  ],
  selectedTeam: "t1",
  selectedType: null
};

/* ---------- TIMER ---------- */
const tDisp = document.getElementById("timerDisplay");
const tDispP = document.getElementById("timerDisplayP");
function fmt(s) {
  const m = Math.floor(s / 60),
    sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}
function updTimer() {
  tDisp.textContent = fmt(state.timer);
  tDispP.textContent = fmt(state.timer);
}
setInterval(() => {
  if (state.running && state.timer > 0) {
    state.timer--;
    updTimer();
  }
}, 1000);
document.getElementById("pauseBtn").onclick = () => {
  state.running = !state.running;
  document.getElementById("pauseBtn").textContent = state.running
    ? "Pause"
    : "Resume";
};
document.getElementById("resetBtn").onclick = () => {
  state.timer = 20 * 60;
  updTimer();
};
updTimer();

/* ---------- TEAM DROPDOWN ---------- */
const teamSelect = document.getElementById("teamSelect");
state.teams.forEach((t) => {
  const opt = document.createElement("option");
  opt.value = t.id;
  opt.textContent = t.name;
  teamSelect.appendChild(opt);
});
teamSelect.onchange = () => (state.selectedTeam = teamSelect.value);

/* ---------- FACILITATOR VIEW ---------- */
const facTeams = document.getElementById("facTeams");
function renderFacilitator() {
  facTeams.innerHTML = "";
  state.teams.forEach((t) => {
    const c = document.createElement("div");
    c.className = "team-card";
    c.innerHTML = `
      <div class="team-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="team-avatar" style="background:${t.color}">
            ${t.name.split(" ")[1]}
          </div>
          <div><div class="team-name">${t.name}</div></div>
        </div>
        <span class="team-status">🧩 ${t.ideas.length} idea${
      t.ideas.length !== 1 ? "s" : ""
    }</span>
      </div>
      <button class="btn" onclick="openModal('${t.id}')">View Ideas</button>`;
    facTeams.appendChild(c);
  });
}
renderFacilitator();

/* ---------- FACILITATOR MODAL ---------- */
const modal = document.getElementById("ideaModal");
const ideaList = document.getElementById("ideaList");
const ideaDetail = document.getElementById("ideaDetail");
let activeTeam = null,
  activeIdea = null;

function openModal(teamId) {
  activeTeam = state.teams.find((t) => t.id === teamId);
  document.getElementById("modalTitle").textContent = activeTeam.name;
  renderList();
  modal.style.display = "flex";
}
document.getElementById("closeModal").onclick = () =>
  (modal.style.display = "none");

function renderList() {
  ideaList.innerHTML = "";
  activeTeam.ideas.forEach((i) => {
    const item = document.createElement("div");
    item.className = "idea-item";
    item.innerHTML = `
      <div class="idea-title">
        ${i.submitter} – ${i.type === "better" ? "Better" : "New"}
        <span class="status-badge">${
          i.unlocked ? "Unlocked" : "Submitted"
        }</span>
      </div>
      <div class="idea-meta">${new Date(i.timestamp).toLocaleTimeString()}</div>`;
    item.onclick = () => {
      document
        .querySelectorAll(".idea-item")
        .forEach((x) => x.classList.remove("active"));
      item.classList.add("active");
      activeIdea = i;
      renderDetail();
    };
    ideaList.appendChild(item);
  });
  if (!activeTeam.ideas.length) {
    ideaList.innerHTML = '<div style="padding:10px;">No ideas yet.</div>';
    ideaDetail.innerHTML = "";
  }
}

function renderDetail() {
  if (!activeIdea) {
    ideaDetail.innerHTML = "";
    return;
  }
  let h = `
    <p><strong>Submitter:</strong> ${activeIdea.submitter}</p>
    <p><strong>Type:</strong> ${
      activeIdea.type === "better"
        ? "Build Something Better"
        : "Build Better Things"
    }</p>`;
  activeIdea.questions.forEach((q, i) => {
    h += `<p><strong>${i + 1}. ${q}</strong><br>${activeIdea.answers[i]}</p>`;
  });
  h += `<p><strong>Status:</strong> ${
    activeIdea.unlocked ? "Unlocked for editing" : "Submitted"
  }</p>
  <button class="btn" id="unlockBtn">${
    activeIdea.unlocked ? "Lock" : "Unlock for edit"
  }</button>`;
  ideaDetail.innerHTML = h;
  document.getElementById("unlockBtn").onclick = () => {
    activeIdea.unlocked = !activeIdea.unlocked;
    renderList();
    renderDetail();
  };
}

/* ---------- PARTICIPANT VIEW ---------- */
const qArea = document.getElementById("questionsArea");
const submitBtn = document.getElementById("submitIdeaBtn");
const nameInput = document.getElementById("submitterName");
const notice = document.getElementById("noticeArea");
const choiceCards = document.querySelectorAll(".choice-card");

choiceCards.forEach((c) =>
  c.addEventListener("click", () => {
    choiceCards.forEach((x) => x.classList.remove("selected"));
    c.classList.add("selected");
    state.selectedType = c.dataset.type;
    renderQs();
  })
);

function renderQs() {
  const t = state.selectedType;
  qArea.innerHTML = "";
  if (!t) return;
  const qs =
    t === "better"
      ? [
          "What process or task do you want to improve?",
          "Where are the biggest friction points today?",
          "How could AI assist or automate this?",
          "What impact would this improvement have?"
        ]
      : [
          "What’s the strategic goal or opportunity?",
          "Who benefits or is impacted?",
          "How would AI enable this new capability?",
          "What outcomes or success metrics would define value?"
        ];
  qs.forEach((q, i) => {
    const f = document.createElement("div");
    f.className = "form-field";
    f.innerHTML = `<label>${i + 1}. ${q}</label><textarea data-i="${i}"></textarea>`;
    qArea.appendChild(f);
  });
  qArea.querySelectorAll("textarea").forEach((t) =>
    t.addEventListener("input", checkFilled)
  );
  submitBtn.disabled = true;
}

function checkFilled() {
  const filled =
    [...qArea.querySelectorAll("textarea")].every(
      (t) => t.value.trim() !== ""
    ) && nameInput.value.trim() !== "";
  submitBtn.disabled = !filled;
}

nameInput.addEventListener("input", checkUnlock);
teamSelect.addEventListener("change", checkUnlock);

function checkUnlock() {
  const t = state.teams.find((x) => x.id === state.selectedTeam);
  const n = nameInput.value.trim();
  const idea = t.ideas.find((i) => i.submitter === n && i.unlocked);
  if (idea) {
    notice.innerHTML =
      '<div class="notice">Your idea has been unlocked for editing.</div>';
    state.selectedType = idea.type;
    document
      .querySelectorAll(".choice-card")
      .forEach((c) =>
        c.classList.toggle("selected", c.dataset.type === state.selectedType)
      );
    renderQs();
    idea.answers.forEach(
      (a, i) => (qArea.querySelectorAll("textarea")[i].value = a)
    );
    submitBtn.disabled = false;
  } else notice.innerHTML = "";
}

submitBtn.onclick = () => {
  const t = state.teams.find((x) => x.id === state.selectedTeam);
  const n = nameInput.value.trim();
  if (!n) {
    alert("Enter your name");
    return;
  }
  const answers = [...qArea.querySelectorAll("textarea")].map((a) =>
    a.value.trim()
  );
  const qs = [...qArea.querySelectorAll("label")].map((l) => l.textContent);
  let idea = t.ideas.find((i) => i.submitter === n && i.unlocked);
  if (idea) {
    idea.answers = answers;
    idea.unlocked = false;
  } else {
    t.ideas.push({
      id: Date.now(),
      submitter: n,
      type: state.selectedType,
      questions: qs,
      answers,
      unlocked: false,
      timestamp: new Date().toISOString()
    });
  }
  renderFacilitator();
  notice.innerHTML = '<div class="notice">✅ Idea submitted!</div>';
  qArea.innerHTML = "";
  submitBtn.disabled = true;
};

/* ---------- ROLE TOGGLE ---------- */
document.querySelectorAll(".toggle-btn").forEach((b) =>
  b.addEventListener("click", () => {
    document
      .querySelectorAll(".toggle-btn")
      .forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    const r = b.dataset.role;
    document
      .getElementById("facilitatorView")
      .classList.toggle("active", r === "facilitator");
    document
      .getElementById("participantView")
      .classList.toggle("active", r === "participant");
    document.getElementById("roleLabel").textContent =
      r === "facilitator" ? "Facilitator" : "Participant";
  })
);
</script>
</body>
</html>
